name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CGO_ENABLED: "0"
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: go test -covermode=set -coverprofile=cover.out ./...
      - name: Enforce 100% coverage
        run: |
          pct=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "total coverage: ${pct}%"
          if awk -v p="$pct" 'BEGIN{exit (p+0<100.0)?1:0}'; then
            echo "coverage OK"
          else
            echo "coverage below 100%; non-covered functions:"
            go tool cover -func=cover.out | awk '$3 != "100.0%"'
            exit 1
          fi

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: linux,   goarch: riscv64 }
          - { goos: linux,   goarch: ppc64le }
          - { goos: linux,   goarch: s390x }
          - { goos: linux,   goarch: loong64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...
